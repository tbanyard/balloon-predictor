name: macOS installer (test)

on:
  push:
    branches: [release-v1.5.1-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: Build Universal disk image
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: arm64
      - name: Build disk image
        run: python desktop/macos/build.py "$RUNNER_TEMP/macos-dist"
      - name: Hand off the disk image for testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macOS-ci-candidate
          path: ${{ runner.temp }}/macos-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify:
    name: Test installed app on ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple silicon
            runner: macos-15
            arch: arm64
            setup_arch: arm64
          - name: Intel
            runner: macos-15-intel
            arch: x86_64
            setup_arch: x64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.setup_arch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macOS-ci-candidate
          path: ${{ runner.temp }}/macos-dist
      - name: Mount, copy and run the app
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python desktop/macos/verify.py "$RUNNER_TEMP/macos-dist" "$EXPECTED_ARCH" \
            "$RUNNER_TEMP/reports/smoke-$EXPECTED_ARCH.json"
      - name: Save the test result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macOS-ci-report-${{ matrix.arch }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: error
          retention-days: 1

  tested-download:
    name: Upload the tested Mac installer
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macOS-ci-candidate
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macOS-ci-report-*
          merge-multiple: true
          path: dist
      - name: Check the image and both results
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS.txt
          test -s smoke-arm64.json
          test -s smoke-x86_64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BalloonPredictor-macOS-Universal-test
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
