name: Windows installer (test)

on:
  push:
    branches: [windows-installer-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install the wheel build tools
        run: |
          python -m pip install --only-binary=:all: setuptools==80.9.0 wheel==0.45.1
      - name: Build Setup.exe
        run: python desktop/windows/build.py "$env:RUNNER_TEMP/BalloonPredictor-dist"
      - name: Install and test the packaged app
        run: python desktop/windows/verify.py "$env:RUNNER_TEMP/BalloonPredictor-dist"
      - name: Upload the tested installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BalloonPredictor-Windows-x64-test
          path: ${{ runner.temp }}/BalloonPredictor-dist/
          if-no-files-found: error
          retention-days: 30
